[workspace]
resolver = "2"
members = [
  "adapters/nautilus",
  "packages/contracts/rust",
  "packages/event-transport",
  "services/gateway",
  "services/projector",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "AGPL-3.0-or-later"
repository = "https://github.com/Montlok/montlok-terminal"

[workspace.dependencies]
anyhow = "1.0.100"
async-trait = "0.1.89"
arrow = { version = "59.3.0", features = ["ipc"] }
async-nats = "0.50.0"
axum = { version = "0.8.9", features = ["http2", "json", "macros", "ws"] }
base64 = "0.22.1"
bytes = "1.11.0"
chrono = { version = "0.4.42", features = ["serde"] }
clap = { version = "4.5.51", features = ["derive", "env"] }
datafusion = { version = "55.0.0", default-features = false, features = ["parquet", "sql"] }
futures-util = "0.3.31"
hex = "0.4.3"
http = "1.3.1"
parquet = { version = "59.3.0", features = ["arrow", "zstd"] }
prost = "0.14.4"
prost-types = "0.14.4"
rusqlite = { version = "0.37.0", features = ["bundled", "chrono"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
serde_yaml = "0.9.34"
sha2 = "0.10.9"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["fs", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tower-http = { version = "0.6.6", features = ["compression-gzip", "cors", "request-id", "trace"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "json"] }
uuid = { version = "1.18.1", features = ["serde", "v7"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
