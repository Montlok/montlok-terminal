# Included in the Ubuntu nginx http {} context. No trading API is exposed on HTTP.
map $http_upgrade $operator_connection_upgrade {
    default upgrade;
    '' close;
}
limit_req_zone $binary_remote_addr zone=operator_login:1m rate=5r/m;
log_format operator_safe '$remote_addr [$time_local] $request_method $uri $status $body_bytes_sent $request_time';

server {
    listen 80 default_server;
    server_name _;
    server_tokens off;
    return 444;
}
server {
    listen 443 ssl default_server;
    server_name _;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_reject_handshake on;
}
server {
    listen 80;
    server_name tokyo.montlok.com;
    server_tokens off;
    access_log /var/log/nginx/operator.access.log operator_safe;
    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/tokyo.montlok.com;
        try_files $uri =404;
    }
    location / { return 308 https://tokyo.montlok.com$request_uri; }
}
server {
    listen 443 ssl http2;
    server_name tokyo.montlok.com;
    root /www/wwwroot/tokyo.montlok.com;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/tokyo.montlok.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tokyo.montlok.com/privkey.pem;
    ssl_client_certificate /www/nautilus/operator/montlok-origin-ca.crt;
    ssl_verify_client on;
    ssl_verify_depth 2;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305;
    ssl_ecdh_curve X25519:secp256r1;
    ssl_session_cache shared:OperatorTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    client_max_body_size 1m;
    client_body_timeout 15s;
    keepalive_timeout 30s;
    access_log /var/log/nginx/operator.access.log operator_safe;
    error_log /var/log/nginx/operator.error.log warn;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' wss://tokyo.montlok.com; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Nginx overwrites every proxy identity header. The BFF only listens on loopback.
    proxy_http_version 1.1;
    proxy_set_header Host 127.0.0.1:18081;
    proxy_set_header X-Operator-Public 1;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $operator_connection_upgrade;
    proxy_connect_timeout 3s;
    proxy_read_timeout 75s;
    proxy_send_timeout 30s;
    proxy_buffering off;
    proxy_cache off;
    location = /api/login {
        limit_req zone=operator_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:18081;
    }
    location = /api/artifacts {
        client_max_body_size 65m;
        client_body_timeout 120s;
        proxy_request_buffering off;
        proxy_pass http://127.0.0.1:18081;
    }
    location / { proxy_pass http://127.0.0.1:18081; }
}
