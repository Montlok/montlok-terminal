# Include inside the existing authenticated HTTPS server. Keep its certificate,
# origin mTLS and /api v1 locations in place during the transition.
location ^~ /api/v2/ {
    proxy_pass http://127.0.0.1:8090;
    proxy_http_version 1.1;
    proxy_set_header Host 127.0.0.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $operator_connection_upgrade;
    proxy_set_header X-Forwarded-Proto https;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 65s;
    add_header Cache-Control "no-store" always;
}

location ~* "^/terminal-v2/.*\.(?:js|css|wasm)$" {
    root /www/wwwroot/tokyo.montlok.com;
    try_files $uri =404;
    expires max;
    access_log off;
}
location = /terminal-v2 {
    return 308 /terminal-v2/;
}
location /terminal-v2/ {
    root /www/wwwroot/tokyo.montlok.com;
    try_files $uri /terminal-v2/index.html;
    expires -1;
}
